<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Pay My Buddy</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f5;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background-color: #ffffff;
            padding: 40px 48px;
            border-radius: 4px;
            box-shadow: 0 0 0 1px #ddd;
            width: 320px;
        }

        .brand-button {
            display: inline-block;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            background-color: #f4a025; /* orange */
            color: white;
            font-weight: 600;
            margin-bottom: 32px;
            cursor: default; /* ce n’est pas un vrai bouton d’action */
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 4px;
            font-size: 14px;
        }

        input {
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .submit-button {
            margin-top: 16px;
            width: 100%;
            padding: 10px 12px;
            border-radius: 4px;
            border: none;
            background-color: #1976d2; /* bleu */
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .error {
            color: #d32f2f;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<main>
    <section class="auth-card">

        <!-- Bouton / badge Pay My Buddy -->
        <button type="button" class="brand-button">
            Pay My Buddy
        </button>

        <!-- Message d'erreur éventuel -->
        <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

        <!-- Formulaire de connexion -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Mail</label>
                <input id="email" name="email" type="email" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input id="password" name="password" type="password" required>
            </div>

            <button type="submit" class="submit-button">
                Se connecter
            </button>
        </form>

    </section>
</main>

</body>
</html>
