<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profil – Pay My Buddy</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f5;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #ffffff;
            padding: 16px 80px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-text {
            font-weight: 600;
        }

        nav a {
            margin-left: 24px;
            text-decoration: none;
            font-size: 14px;
            color: #333333;
        }

        nav a.active {
            color: #1976d2;
            font-weight: 600;
        }

        main {
            flex: 1;
            padding: 40px 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 40px 80px;
            min-width: 520px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .profile-label {
            font-weight: 600;
            width: 120px;
        }

        .profile-value {
            flex: 1;
            color: #555555;
        }

        .edit-button {
            margin-top: 24px;
            padding: 10px 24px;
            border-radius: 4px;
            border: none;
            background-color: #f4a025;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="app-container">

    <header>
        <div class="brand-text">Pay My Buddy</div>
        <nav>
            <a th:href="@{/transfer}">Transférer</a>
            <a th:href="@{/profile}" class="active">Profil</a>
            <a th:href="@{/add-connection}">Ajouter relation</a>
            <a th:href="@{/logout}">Se déconnecter</a>
        </nav>
    </header>

    <main>
        <section class="profile-card">

            <div class="profile-row">
                <div class="profile-label">Username</div>
                <div class="profile-value" th:text="${username}">@username</div>
            </div>

            <div class="profile-row">
                <div class="profile-label">Mail</div>
                <div class="profile-value" th:text="${email}">nom@domain.com</div>
            </div>

            <div class="profile-row">
                <div class="profile-label">Mot de passe</div>
                <div class="profile-value">********</div>
            </div>

            <button type="button" class="edit-button">Modifier</button>

        </section>
    </main>

</div>
</body>
</html>
