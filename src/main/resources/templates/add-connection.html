<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une relation – Pay My Buddy</title>

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f5;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #ffffff;
            padding: 16px 80px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-text {
            font-weight: 600;
        }

        nav a {
            margin-left: 24px;
            text-decoration: none;
            font-size: 14px;
            color: #333333;
        }

        nav a.active {
            color: #1976d2;
            font-weight: 600;
        }

        main {
            flex: 1;
            padding: 40px 80px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .add-card {
            background-color: #ffffff;
            border-radius: 4px;
            border: 1px solid #ddd;
            padding: 40px 48px;
            min-width: 480px;
        }

        .add-title {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .add-form {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .add-form input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .add-button {
            padding: 10px 24px;
            border-radius: 4px;
            border: none;
            background-color: #f4a025;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="app-container">

    <header>
        <div class="brand-text">Pay My Buddy</div>
        <nav>
            <a th:href="@{/transfer}">Transférer</a>
            <a th:href="@{/profile}">Profil</a>
            <a th:href="@{/add-connection}" class="active">Ajouter relation</a>
            <a th:href="@{/logout}">Se déconnecter</a>
        </nav>
    </header>

    <main>
        <section class="add-card">
            <div class="add-title">Chercher une relation</div>

            <form class="add-form" th:action="@{/add-connection}" method="post">
                <input type="email" name="email" placeholder="Saisir une adresse mail" required>
                <button type="submit" class="add-button">Ajouter</button>
            </form>
        </section>
    </main>

</div>
</body>
</html>
