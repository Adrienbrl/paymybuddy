spring:
  application:
    name: paymybuddy

  datasource:
    url: jdbc:mysql://localhost:3306/paymybuddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false   # utile si la base contient déjà des tables

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
    org.flywaydb: info
